<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">oh-my-dsh</title>
  <desc id="desc">A curated distribution of DeepSeek Harness. Overlay, not a fork.</desc>
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="50%" stop-color="#0d0f17"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>

    <!-- Warm Amber/Gold Ambient Glow -->
    <radialGradient id="ambient-glow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#c9a15a" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#c9a15a" stop-opacity="0.06"/>
      <stop offset="70%" stop-color="#0d0f17" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="top-flare" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Gradients for Top Overlay Layer -->
    <linearGradient id="gold-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cf9b"/>
      <stop offset="45%" stop-color="#c9a15a"/>
      <stop offset="100%" stop-color="#8d6e32"/>
    </linearGradient>

    <linearGradient id="gold-edge-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b68d44"/>
      <stop offset="100%" stop-color="#6e511f"/>
    </linearGradient>

    <linearGradient id="gold-edge-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfbe7d"/>
      <stop offset="100%" stop-color="#8a6727"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5efe6"/>
      <stop offset="100%" stop-color="#d6ccba"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>

    <!-- Outer Card Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="40%" stop-color="#c9a15a" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Subtle Glow Filter for Top Element -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1280" height="520" rx="16" fill="url(#bg-grad)"/>
  <rect width="1280" height="520" rx="16" fill="url(#dot-grid)"/>
  <rect width="1280" height="520" rx="16" fill="url(#ambient-glow)"/>
  <rect width="1280" height="520" rx="16" fill="url(#top-flare)"/>

  <!-- 1px Subtle Outer Border -->
  <rect x="0.5" y="0.5" width="1279" height="519" rx="15.5" fill="none" stroke="url(#border-grad)" stroke-width="1"/>

  <!-- ==================== 3D ISOMETRIC STACK (BASE -> PROFILE -> OVERLAY) ==================== -->
  <g transform="translate(640, 102)">
    <!-- Base Layer (DSH Core) - cy: +40 -->
    <g transform="translate(0, 40)" opacity="0.65">
      <!-- Drop shadow -->
      <path d="M-80,0 L0,38 L80,0 L0,-38 Z" fill="#000000" opacity="0.4" transform="translate(0, 14)"/>
      <!-- Side Left -->
      <path d="M-80,0 L0,38 L0,48 L-80,10 Z" fill="#141720"/>
      <!-- Side Right -->
      <path d="M0,38 L80,0 L80,10 L0,48 Z" fill="#1c202c"/>
      <!-- Top Face -->
      <path d="M-80,0 L0,38 L80,0 L0,-38 Z" fill="#1a1e29" stroke="#2e3547" stroke-width="1"/>
    </g>

    <!-- Mid Layer (Cordis Profiles) - cy: +18 -->
    <g transform="translate(0, 18)" opacity="0.85">
      <!-- Side Left -->
      <path d="M-80,0 L0,38 L0,48 L-80,10 Z" fill="#1d222f"/>
      <!-- Side Right -->
      <path d="M0,38 L80,0 L80,10 L0,48 Z" fill="#282f40"/>
      <!-- Top Face -->
      <path d="M-80,0 L0,38 L80,0 L0,-38 Z" fill="#232938" stroke="#3d4760" stroke-width="1"/>
    </g>

    <!-- Floating Top Layer (OMD Golden Overlay) - cy: -14 -->
    <g transform="translate(0, -14)">
      <!-- Golden Ambient Glow beneath top layer -->
      <ellipse cx="0" cy="8" rx="84" ry="42" fill="#c9a15a" opacity="0.25" filter="url(#gold-glow)"/>
      <!-- Side Left -->
      <path d="M-80,0 L0,38 L0,50 L-80,12 Z" fill="url(#gold-edge-left)"/>
      <!-- Side Right -->
      <path d="M0,38 L80,0 L80,12 L0,50 Z" fill="url(#gold-edge-right)"/>
      <!-- Top Face -->
      <path d="M-80,0 L0,38 L80,0 L0,-38 Z" fill="url(#gold-surface)" stroke="#fae3b4" stroke-width="1.2"/>
      <!-- Inner Specular Lines -->
      <path d="M-74,-1 L0,34 L74,-1" fill="none" stroke="#fff1d0" stroke-width="0.8" opacity="0.5"/>
    </g>
  </g>

  <!-- ==================== MAIN TITLE ==================== -->
  <text x="640" y="278" text-anchor="middle" fill="url(#title-grad)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="82" font-weight="700" letter-spacing="-2.5">oh-my-dsh</text>

  <!-- ==================== PILL BADGE (TAGLINE) ==================== -->
  <g transform="translate(640, 342)">
    <!-- Pill Container -->
    <rect x="-150" y="-18" width="300" height="36" rx="18" fill="#141722" fill-opacity="0.9" stroke="#c9a15a" stroke-width="1" stroke-opacity="0.45"/>
    
    <!-- Glowing Indicator Dot -->
    <circle cx="-120" cy="0" r="6" fill="#c9a15a" fill-opacity="0.25"/>
    <circle cx="-120" cy="0" r="3.5" fill="#e8cf9b"/>

    <!-- Badge Text -->
    <text x="-106" y="4.5" fill="#e5c88f" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3.2">OVERLAY, NOT A FORK</text>
  </g>

  <!-- ==================== SUBTITLE ==================== -->
  <text x="640" y="420" text-anchor="middle" fill="#9ba1b0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="400" letter-spacing="0.2">A curated distribution of DeepSeek Harness</text>
</svg>

name: Release

# Publishes to npm with provenance and creates a GitHub Release when a `v*` tag is pushed.
# Requires the NPM_TOKEN repository secret (npm granular automation token
# with publish access to the oh-my-dsh package) or npm Trusted Publishing.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Verify tag and version exports match
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          exported="$(node -e "import('./dist/src/index.js').then((m) => console.log(m.version))")"
          test "$tag" = "$manifest" || { echo "tag v$tag does not match package.json $manifest" >&2; exit 1; }
          test "$exported" = "$manifest" || { echo "src/index.ts exports $exported but package.json says $manifest" >&2; exit 1; }

  portable:
    name: Portable / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build portable distribution
        run: node scripts/build-portable-distribution.mjs --out-dir dist-release --platform ${{ matrix.platform }}

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.platform }}
          path: |
            dist-release/*.tar.gz
            dist-release/release-manifest.json
            dist-release/SHA256SUMS
          if-no-files-found: error

  aggregate:
    needs: portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download portable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: portable-artifacts
          merge-multiple: false

      - name: Aggregate release manifest and checksums
        run: |
          node <<'EOF'
          import {
            copyFileSync,
            mkdirSync,
            readdirSync,
            readFileSync,
            statSync,
            writeFileSync,
          } from 'node:fs'
          import { join } from 'node:path'

          const artifactRoot = 'portable-artifacts'
          const outDir = 'dist-release'
          mkdirSync(outDir, { recursive: true })

          const sums = new Map()
          let manifest = null

          for (const entry of readdirSync(artifactRoot)) {
            const dir = join(artifactRoot, entry)
            for (const tarball of readdirSync(dir).filter((name) => name.endsWith('.tar.gz'))) {
              copyFileSync(join(dir, tarball), join(outDir, tarball))
            }

            const partialManifest = JSON.parse(
              readFileSync(join(dir, 'release-manifest.json'), 'utf8'),
            )
            if (!manifest) {
              manifest = partialManifest
            } else {
              Object.assign(manifest.artifacts, partialManifest.artifacts)
              manifest.releasedAt = partialManifest.releasedAt
            }

            for (const line of readFileSync(join(dir, 'SHA256SUMS'), 'utf8').split('\n')) {
              const trimmed = line.trim()
              if (!trimmed) continue
              const match = trimmed.match(/^([a-f0-9]{64})\s{2}(.+)$/)
              if (match) sums.set(match[2], match[1])
            }
          }

          if (!manifest) {
            throw new Error('no portable release manifest artifacts were downloaded')
          }

          const sumLines = [...sums.entries()]
            .sort((a, b) => a[0].localeCompare(b[0]))
            .map(([filename, sha256]) => `${sha256}  ${filename}\n`)
          writeFileSync(join(outDir, 'SHA256SUMS'), sumLines.join(''), 'utf8')
          writeFileSync(
            join(outDir, 'release-manifest.json'),
            `${JSON.stringify(manifest, null, 2)}\n`,
          )

          copyFileSync('install.sh', join(outDir, 'install.sh'))

          const files = readdirSync(outDir)
          console.log('release assets:')
          for (const file of files.sort()) {
            console.log(`  ${file} (${statSync(join(outDir, file)).size} bytes)`)
          }
          EOF

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist-release/*
          if-no-files-found: error

  publish:
    needs: [quality, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        # Idempotent: a tag whose version is already on the registry (e.g. a
        # release published locally) records green instead of failing.
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "oh-my-dsh@$version" version > /dev/null 2>&1; then
            echo "oh-my-dsh@$version already exists on npm; skipping publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: [aggregate, publish, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist-release

      - name: Create GitHub Release and upload assets
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          assets=(dist-release/*.tar.gz dist-release/release-manifest.json dist-release/SHA256SUMS dist-release/install.sh)

          if ! gh release view "$tag" > /dev/null 2>&1; then
            node -e '
              import { readFileSync, writeFileSync } from "node:fs"
              const changelog = readFileSync("CHANGELOG.md", "utf8")
              const version = process.argv[1]
              const regex = new RegExp(`## \\[${version.replace(/\./g, "\\.")}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)`)
              const match = changelog.match(regex)
              const notes = match ? match[1].trim() : ""
              writeFileSync("release-notes.md", notes)
            ' "$version"
            if [ -s release-notes.md ]; then
              gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
            else
              gh release create "$tag" --title "$tag" --generate-notes --verify-tag
            fi
          else
            echo "GitHub release $tag already exists; uploading assets only." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          gh release upload "$tag" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
